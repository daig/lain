# XcodeGen spec — the ONLY source of project structure (ARCHITECTURE.md §8, docs/XCODE-WORKFLOW.md).
# Regenerate with Scripts/bootstrap.sh. lain.xcodeproj and Generated/ are git-ignored.
name: lain
options:
  bundleIdPrefix: sub.dev.lain
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 8DWR7MSCR6
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES   # required: test targets fail to code-sign without it
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LainKit:
    path: Packages/LainKit
targets:
  LainHost:
    type: application
    platform: macOS
    sources:
      - Apps/Host
      # The login LaunchAgent (§5.7), registered with SMAppService.agent(plistName:).
      - path: Apps/HostAgent
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: LainKit
        product: LainHostCore
    info:
      path: Generated/LainHost-Info.plist
      properties:
        CFBundleDisplayName: lain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true              # menu-bar agent, no Dock icon
        LSApplicationCategoryType: public.app-category.utilities
    entitlements:
      path: Generated/LainHost.entitlements
      properties:
        # Data-protection Keychain for the pairing secret (§7.6); requires a provisioning profile,
        # so the Mac is registered in the developer account.
        keychain-access-groups: ["$(AppIdentifierPrefix)sub.dev.lain.host"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sub.dev.lain.host
        PRODUCT_NAME: LainHost
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO         # unsandboxed by design (D5)
        CODE_SIGN_IDENTITY: "Apple Development"   # never ad hoc: TCC grants would reset (§2)
  LainClient:
    type: application
    platform: iOS
    sources: [Apps/Client]
    dependencies:
      - package: LainKit
        product: LainClientCore
    info:
      path: Generated/LainClient-Info.plist
      properties:
        CFBundleDisplayName: lain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        # All four are declared because UIRequiresFullScreen is deprecated (iOS 26) and a landscape-only
        # plist then warns; the view controllers restrict themselves to landscape.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sub.dev.lain.client
        PRODUCT_NAME: LainClient
        TARGETED_DEVICE_FAMILY: "2"    # iPad only
  # Hosted unit tests: run inside the signed app, so Keychain and other identity-bound APIs work.
  LainClientTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Apps/ClientTests]
    dependencies:
      - target: LainClient
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        PRODUCT_BUNDLE_IDENTIFIER: sub.dev.lain.client.tests
  LainHostTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Apps/HostTests]
    dependencies:
      - target: LainHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sub.dev.lain.host.tests
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  LainHost:
    build:
      targets: { LainHost: all }
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LainKit/LainProtocolTests
        - package: LainKit/LainTelemetryTests
        - package: LainKit/LainInputTests
        - package: LainKit/LainUSBMuxTests
        - package: LainKit/LainTransportTests
        - package: LainKit/LainMediaTests
        - package: LainKit/LainLoopbackTests      # USB path + real HEVC pipeline (macOS)
        - package: LainKit/LainHostCoreTests
        - LainHostTests
  LainClient:
    build:
      targets: { LainClient: all }
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LainKit/LainProtocolTests
        - package: LainKit/LainTelemetryTests
        - package: LainKit/LainInputTests
        - package: LainKit/LainTransportTests   # listener + pairing on the iPadOS runtime
        - package: LainKit/LainMediaTests
        - package: LainKit/LainClientCoreTests  # input pipeline + ClientSession over loopback TCP
        - LainClientTests
