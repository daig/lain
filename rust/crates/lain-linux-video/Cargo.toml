[package]
name = "lain-linux-video"
description = "PipeWire capture and VA-API HEVC encoding on the AMD iGPU, as one VideoBackend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lain-platform.workspace = true
lain-gnome.workspace = true
# GL compute through EGL on GBM (L7). EGL is loaded at run time, only once the environment pins Mesa.
glow.workspace = true
khronos-egl = { workspace = true, features = ["dynamic"] }
pipewire.workspace = true
# open, fstat, lseek and dup on the render node and the DMA-BUFs.
rustix = { workspace = true, features = ["fs"] }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
# The packed-header round trip through lain-media's parameter-set extraction (the core's reader).
lain-media.workspace = true
lain-platform = { workspace = true, features = ["fake"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }

[build-dependencies]
bindgen.workspace = true
pkg-config.workspace = true

[lints]
workspace = true
