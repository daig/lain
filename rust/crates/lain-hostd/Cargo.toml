[package]
name = "lain-hostd"
description = "The lain host daemon: configuration, wiring, control interface, CLI and tray."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
lain-proto.workspace = true
lain-platform.workspace = true
lain-link.workspace = true
lain-usbmux.workspace = true
lain-input.workspace = true
lain-media.workspace = true
lain-wifi.workspace = true
lain-host.workspace = true
lain-gnome.workspace = true
lain-linux-video.workspace = true
lain-linux-system.workspace = true
anyhow.workspace = true
clap.workspace = true
# The tray icon (StatusNotifierItem), on the same zbus 5 as everything else.
ksni.workspace = true
# The open-file limit (getrlimit/setrlimit) without unsafe.
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "signal"] }
toml.workspace = true
tracing.workspace = true
tracing-journald.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zbus.workspace = true

[dev-dependencies]
lain-platform = { workspace = true, features = ["fake"] }
lain-usbmux = { workspace = true, features = ["fake"] }
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "signal", "net", "io-util", "process"] }

[lints]
workspace = true

# The Ubuntu package (`rust/dist/build-deb.sh`, through cargo-deb). `$auto` adds the linked libraries (libva,
# libgbm, PipeWire, OpenSSL); the rest is loaded at run time (EGL through glvnd, Mesa's EGL vendor and its VA
# driver radeonsi) or talked to over sockets and D-Bus (usbmuxd, Avahi, the Secret Service).
[package.metadata.deb]
name = "lain"
maintainer = "dai <daig@users.noreply.github.com>"
copyright = "2026 dai"
license-file = ["../../../LICENSE", "0"]
section = "net"
priority = "optional"
extended-description = """\
The Linux host for lain: an iPad becomes this computer's display, keyboard and trackpad, over USB-C or Wi-Fi \
(the local network; peer-to-peer AWDL is Apple-only). GNOME on Wayland, HEVC on the AMD iGPU. lain-hostd runs \
as a systemd user unit with the desktop session (`lain autostart on`); `lain` is its command line."""
depends = "$auto, libegl1, libegl-mesa0, mesa-libgallium, usbmuxd, avahi-daemon, gnome-keyring"
recommends = "gnome-shell-ubuntu-extensions"
maintainer-scripts = "../../dist/debian/"
assets = [
    ["target/release/lain-hostd", "usr/bin/", "755"],
    ["target/release/lain", "usr/bin/", "755"],
    ["../../dist/lain-hostd.service", "usr/lib/systemd/user/", "644"],
    ["config.example.toml", "usr/share/doc/lain/", "644"],
    ["../../dist/icons/lain-connected-symbolic.svg", "usr/share/icons/hicolor/scalable/status/", "644"],
    ["../../dist/icons/lain-idle-symbolic.svg", "usr/share/icons/hicolor/scalable/status/", "644"],
]
