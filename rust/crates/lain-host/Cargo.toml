[package]
name = "lain-host"
description = "The session engine: USB device loop, Wi-Fi admission, the live session, status."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lain-proto.workspace = true
lain-platform.workspace = true
lain-link.workspace = true
lain-usbmux.workspace = true
lain-input.workspace = true
lain-media.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }
tracing.workspace = true

[dev-dependencies]
lain-platform = { workspace = true, features = ["fake"] }
lain-usbmux = { workspace = true, features = ["fake"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "test-util"] }

[lints]
workspace = true
