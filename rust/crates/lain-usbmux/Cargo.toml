[package]
name = "lain-usbmux"
description = "A usbmuxd client (list, listen, connect) and a fake usbmuxd for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# A fake usbmuxd on a temporary Unix socket, for this crate's and lain-host's tests (`fake` module).
fake = ["dep:tempfile", "tokio/rt"]

[dependencies]
bytes.workspace = true
plist.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "macros"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "macros", "rt"] }

# The fake-daemon tests need the `fake` feature: `cargo test -p lain-usbmux --all-features`.
[[test]]
name = "fake_daemon"
required-features = ["fake"]

[lints]
workspace = true
