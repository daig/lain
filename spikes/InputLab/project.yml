# Throwaway spike (S4/S5): what does iPadOS deliver from the Magic Keyboard + trackpad?
# Deployment target is 26.0 only so it builds with whatever Xcode is installed; lain itself targets 27.
name: InputLab
options:
  bundleIdPrefix: com.dai.lain
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: 8DWR7MSCR6
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  InputLab:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Input Lab
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        PRODUCT_BUNDLE_IDENTIFIER: com.dai.lain.inputlab
